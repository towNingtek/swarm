# Swarm shared nginx settings. Generated by site/common.py; do not edit by hand.
map $http_upgrade $swarm_connection_upgrade {
    default upgrade;
    ''      close;
}
# Access log without query strings or Referer: invite links (?token=) and
# site entry tickets (?ticket=) are bearer credentials.
log_format swarm_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';
