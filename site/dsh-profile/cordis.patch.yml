# dsh 站台 web profile 的 profile 層 patch。
# @summersec/dsh-web-auth 作為 bundle 載入時，自帶 cordis.patch.yml 會 disable stock
# webserver 並 insert webserver-auth；這裡「同 id restate config」覆寫站台專屬設定
# （密碼、session、trustProxy）。背後是 nginx，client IP 經 X-Forwarded-For 抵達，
# 所以 trustProxy 必須開，否則每次登入都被當成 127.0.0.1。secureCookie=auto 因上游 https
# 而封 Secure cookie。
- id: webserver-auth
  name: '@summersec/dsh-web-auth'
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3081
    authMode: !!js process.env.WEB_AUTH_MODE ?? 'always'
    username: !!js process.env.WEB_AUTH_USERNAME ?? 'admin'
    password: !!js process.env.WEB_AUTH_PASSWORD
    passwordHash: !!js process.env.WEB_AUTH_PASSWORD_HASH
    entrySecret: !!js process.env.WEB_AUTH_ENTRY_SECRET ?? ''
    sessionTtlMinutes: 720
    maxAttempts: 5
    attemptWindowSeconds: 300
    secureCookie: auto
    trustProxy: true
    # 只有對話分享的訪客頁（/share/…）不經登入；外掛自己驗證訪客。其他路徑照舊要登入。
    publicPrefixes: ['/share']

# 站台預設語系。不設定時 client 依 navigator.language 推斷。
# 客戶站台預設繁體中文（zh-TW，由 swarm-brand 提供，退回 DSH 的 zh），
# 仍可在 設定 → 通用設定 切換成 English／中文。
# 注意：非 loopback 頁面的選擇只存在於該 process，不會寫回 profile，所以預設值
# 必須由這裡提供，不能靠使用者設定一次就長期生效。
- id: locale
  name: '@deepseek-ai/dsh-client-locale'
  config:
    preference: !!js process.env.DSH_DEFAULT_LOCALE ?? 'zh-TW'

# 第一次進站時 DSH 會建立「預設工作區」：在系統的 Documents 底下建
# deepseek-harness/default-workspace。容器裡沒有 xdg-user-dir，查不到 Documents，
# 客戶一進站就看到「無法建立預設工作區」。這裡指定 Documents，映像裡的
# default-workspace 是指向 /home/dsh/workspace 的 symlink（見 site/Dockerfile），
# 所以預設工作區就是放著辦公室範本的那個目錄。
- id: workspace-controller
  name: '@deepseek-ai/dsh-api-workspace-controller'
  config:
    documentsDirectory: /opt/swarm-documents

# 看板（dsh-swarm-board，外掛自己的 patch 已 insert）：這裡同 id restate 站台設定。
# /board/ 在站台登入後面，不要加進任何 publicPrefixes。
# SWARM_BOARD_PROJECTS：逗號分隔，數字＝預設組織（SWARM_BOARD_ORG）的 project，或「組織/編號」；空＝站台自己從清單加入。
# 策略中樞（dsh-synapse）：/synapse/ 在站台登入後面，不要加進任何 publicPrefixes。
# 資料都在站台內抓：HackMD 中樞（站台的 HackMD token）、GitHub Project／EPIC（站台的 gh）、hives（站台的 swarm）。
# SYNAPSE_HACKMD_NOTE 空＝不抓中樞；SYNAPSE_ORGS 逗號分隔，空＝不抓 Project／EPIC。
- id: synapse
  name: 'dsh-synapse'
  config:
    hackmdNote: !!js process.env.SYNAPSE_HACKMD_NOTE || undefined
    hackmdTokenFile: !!js process.env.SYNAPSE_HACKMD_TOKEN_FILE || undefined
    orgs: !!js (process.env.SYNAPSE_ORGS || '').split(',').map((s) => s.trim()).filter(Boolean)
    hivesDir: !!js process.env.SYNAPSE_HIVES_DIR || undefined
    devices: !!js (process.env.SYNAPSE_DEVICES || '').split(',').map((s) => s.trim()).filter(Boolean)
    hubUrl: !!js process.env.SYNAPSE_HUB_URL || undefined
    cwd: !!js process.env.SWARM_BOARD_THINK_CWD || undefined

- id: swarm-board
  name: 'dsh-swarm-board'
  config:
    org: !!js process.env.SWARM_BOARD_ORG || undefined
    projects: !!js "(process.env.SWARM_BOARD_PROJECTS || '').split(',').map((s) => s.trim()).filter(Boolean).map((s) => (/^\\d+$/.test(s) ? Number(s) : s)).filter((x) => x !== 0)"
    thinkCwd: !!js process.env.SWARM_BOARD_THINK_CWD || undefined
